name: Verificaciones

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: SPEC, datos y golden set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias de verificación
        run: pip install -r requirements-verificacion.txt

      - name: Estructura del SPEC
        run: python scripts/verificar_spec.py SPEC.md

      - name: Checksums de las fuentes (FUENTES.md)
        run: cd data/fuentes && sha256sum -c SHA256SUMS

      - name: Ejemplos de selección y simulación (§7.4 y §7.5)
        run: python analisis/verificar_reglas_catalogo_v3.py

      - name: Tabla de referencia del panel histórico (§7.7)
        run: python analisis/cotejar_tabla_referencia.py SPEC.md

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Diagramas Mermaid
        run: |
          cd scripts && npm ci --no-audit --no-fund
          cd .. && node scripts/verificar_mermaid.mjs SPEC.md

      - name: Validadores del golden set y coherencia de los prompts
        run: node --test tests/golden_set.test.mjs

  app:
    name: App, pruebas e imagen
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: brujula
          POSTGRES_PASSWORD: brujula
          POSTGRES_DB: brujula
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brujula" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LLM_MODE: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas (SQLite, cliente falso, sin red)
        run: python -m pytest -q tests

      - name: Pruebas de integración con PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://brujula:brujula@localhost:5432/brujula
        run: python -m pytest -q tests/integration

      - name: Construir la imagen
        run: docker build -t brujula:${{ github.sha }} .

      - name: Arrancar el contenedor y verificar /health y /ready
        run: |
          docker run -d --name app -p 8000:8000 -e LLM_MODE=demo brujula:${{ github.sha }}
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 1; done
          curl -fsS http://localhost:8000/ready
          docker logs app | tail -20

      - name: Sin secretos en el repositorio
        run: |
          ! git grep -n -I -E "sk-ant-[A-Za-z0-9_-]{10,}" -- . ':!*.md'
